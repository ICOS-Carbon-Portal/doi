# Local override example. Copy to application.conf and adjust as needed.
# Values below mirror the defaults from jvm/src/main/resources/application.conf,
# with the most commonly overridden local/production values listed explicitly.

# Optional auth overrides. Defaults come from cpauth-core reference.conf.
# authPub.ICOS.authHost = "cpauth.icos-cp.eu"
# authPub.SITES.authHost = "auth.fieldsites.se"

cpdoi{
	# Server binding
	httpBindInterface = "localhost" # use "0.0.0.0" to listen on all interfaces
	httpBindPort = 8079

	# Active ENVRI: "ICOS" or "SITES"
	envri = "ICOS"

	# Users that can publish/delete DOIs
	admins = ["developer@example.org"]

	# Fallback user for local development when no auth cookie is available
	developmentUser = "developer@example.org"

	envriConfigs{
		ICOS{
			metaHost = "127.0.0.1:9094" # production/staging example: "metastaging.icos-cp.eu"
			publicHost = "localhost:8079" # production example: "doi.icos-cp.eu"

			# DataCite defaults live in jvm/src/main/resources/application.conf;
			# normally only passwords need to be overridden.
			test.member.password = ""
			production.member.password = ""

			mailing{
				smtpServer = "localhost"
				username = "doi@icos-cp.eu"
				password = ""
				fromAddress = "doi@icos-cp.eu"
				toAddresses = []
			}
		}

		SITES{
			metaHost = "127.0.0.1:9096" # production example: "meta.fieldsites.se"
			publicHost = "localhost:8079" # production example: "doi.fieldsites.se"

			# SITES intentionally only exposes the production DataCite environment.
			# DataCite defaults live in jvm/src/main/resources/application.conf;
			# normally only the password needs to be overridden.
			production.member.password = ""

			mailing{
				smtpServer = "localhost"
				username = "doi@fieldsites.se"
				password = ""
				fromAddress = "doi@fieldsites.se"
				toAddresses = []
			}
		}
	}
}

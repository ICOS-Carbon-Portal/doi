# Local override example. Copy to application.conf and adjust secrets/hosts.

cpdoi{
	# Use ICOS or SITES. Defaults to ICOS
	envri = "SITES"

	httpBindInterface = "127.0.0.1"
	# httpBindPort = 8079

	admins = ["admin@example.org"]

	# Per-ENVRI overrides. The defaults live in jvm/src/main/resources/application.conf.
	envriConfigs{
		SITES{
			metaHost = "meta.fieldsites.se"
			publicHost = "doi.fieldsites.se"
			# For local metadata service testing:
			# metaHost = "127.0.0.1:9096"

			test.member.password = "<datacite-test-password>"
			production.member.password = "<datacite-production-password>"

			mailing{
				password = "<smtp-password>"
				toAddresses = ["doi-admin@example.org"]
			}
		}
	}

	development = true
	skipCacheInvalidation = true
}

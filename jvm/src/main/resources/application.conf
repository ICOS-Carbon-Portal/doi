cpdoi{
	httpBindInterface = "localhost"
	httpBindPort = 8079
	admins = []

	envri = "ICOS"

	envriConfigs{
		ICOS{
			test{
				restEndpoint = "https://api.test.datacite.org/"
				member{
					symbol = "ZHRH.ICOS"
					password = ""
					prefix = "10.23679"
				}
			}

			production{
				restEndpoint = "https://api.datacite.org/"
				member{
					symbol = "SND.ICOS"
					password = "not here"
					prefix = "10.18160"
				}
			}

			mailing{
				smtpServer: "smtp.protonmail.ch"
				username: "doi@icos-cp.eu"
				password: "dummy (replace in proper config)"
				fromAddress: "doi@icos-cp.eu"
				toAddresses: []
			}
			metaHost = "metastaging.icos-cp.eu"
			publicHost = "doi.icos-cp.eu"
		}

		SITES{
			production{
				restEndpoint = "https://api.datacite.org/"
				member{
					symbol = "SND.SITES"
					password = "not here"
					prefix = "10.23700"
				}
			}

			mailing{
				smtpServer: "smtp.protonmail.ch"
				username: "doi@fieldsites.se"
				password: "dummy (replace in proper config)"
				fromAddress: "doi@fieldsites.se"
				toAddresses: []
			}
			metaHost = "meta.fieldsites.se"
			publicHost = "doi.fieldsites.se"
		}
	}

	# Backwards-compatible defaults. Existing deployments that override these flat paths keep working.
	test = ${cpdoi.envriConfigs.ICOS.test}
	production = ${cpdoi.envriConfigs.ICOS.production}
	mailing = ${cpdoi.envriConfigs.ICOS.mailing}
	metaHost = ${cpdoi.envriConfigs.ICOS.metaHost}
	publicHost = ${cpdoi.envriConfigs.ICOS.publicHost}

	# Set to true in local/dev overrides to serve fastopt JS
	development = false
	skipCacheInvalidation = false
}
